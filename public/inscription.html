<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — Sénégal Connect</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<header class="entete-simple">
  <a href="index.html" class="logo-hero">Sénégal <span>Connect</span></a>
  <nav><a href="connexion.html">Se connecter</a></nav>
</header>

<section class="page-formulaire">
  <div class="motif-wax motif-wax--bas"></div>
  <div class="carte-formulaire">
    <h2>🇸🇳 Créer un compte abonné</h2>
    <p class="sous-titre">Rejoignez Sénégal Connect en quelques secondes</p>

  <form id="form-inscription">
    <div class="champ">
      <label>Prénom</label>
      <input id="champ-prenom" type="text" placeholder="Aminata" required>
    </div>
    <div class="champ">
      <label>Nom</label>
      <input id="champ-nom" type="text" placeholder="Diallo" required>
    </div>
    <div class="champ">
      <label>✉️ Email</label>
      <input id="champ-email" type="email" placeholder="vous@exemple.sn" autocomplete="username" required>
    </div>
    
    <!-- Champ requis par la table clients (MSISDN Sénégal) -->
    <div class="champ">
      <label>📱 Numéro de téléphone (MSISDN)</label>
      <input id="champ-msisdn" type="tel" placeholder="+221770000000" pattern="^\+221[0-9]{9}$" required>
      <small style="color: #666; font-size: 0.85rem;">Format requis : +221 suivi de 9 chiffres</small>
    </div>

    <!-- Champ requis pour lier un forfait initial -->
    <div class="champ">
      <label>📦 Choisir un forfait</label>
      <select id="champ-forfait" required>
        <option value="" disabled selected>Sélectionnez un forfait</option>
        <option value="1">Forfait Eco (2 Go / 60 min - 3 000 FCFA)</option>
        <option value="2">Forfait Confort (10 Go / 300 min - 8 000 FCFA)</option>
        <option value="3">Forfait Premium (30 Go / 1000 min - 15 000 FCFA)</option>
        <option value="4">Forfait Illimite (50 Go / 3000 min - 25 000 FCFA)</option>
      </select>
    </div>

    <div class="champ">
      <label>🔒 Mot de passe</label>
      <input id="champ-mdp" type="password" placeholder="Au moins 6 caractères" autocomplete="new-password" required minlength="6">
    </div>
    <div class="champ">
      <label>🔒 Confirmer le mot de passe</label>
      <input id="champ-mdp-confirmation" type="password" placeholder="••••••••" autocomplete="new-password" required minlength="6">
    </div>

    <button id="bouton-inscription" type="submit" class="bouton-form">Créer mon compte</button>
    <p id="erreur-inscription" class="message-erreur"></p>
  </form>

    <div class="separateur-liens">
      <a href="index.html">← Retour à l'accueil</a>
      <a href="connexion.html">Déjà inscrit ?</a>
    </div>
    <p class="connexion-securisee">🔒 Vos données restent confidentielles</p>
  </div>
</section>

<script>
  document.getElementById('form-inscription').addEventListener('submit', async (e) => {
    e.preventDefault();
    const bouton = document.getElementById('bouton-inscription');
    const erreur = document.getElementById('erreur-inscription');
    erreur.textContent = '';

    const motDePasse = document.getElementById('champ-mdp').value;
    const confirmation = document.getElementById('champ-mdp-confirmation').value;
    if (motDePasse !== confirmation) {
      erreur.textContent = 'Les mots de passe ne correspondent pas';
      return;
    }

    bouton.disabled = true;
    bouton.textContent = 'Création...';

    try {
      // Utilisation de la route dédiée '/api/auth/inscription-client'
      const reponse = await fetch('/api/auth/inscription-client', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nom: document.getElementById('champ-nom').value,
          prenom: document.getElementById('champ-prenom').value,
          email: document.getElementById('champ-email').value,
          mot_de_passe: motDePasse,
          msisdn: document.getElementById('champ-msisdn').value,
          forfait_id: parseInt(document.getElementById('champ-forfait').value, 10),
        }),
      });
      const donnees = await reponse.json();

      if (!reponse.ok) {
        erreur.textContent = donnees.erreurs?.[0]?.message || donnees.message || "Échec de l'inscription";
        return;
      }

      window.location.href = 'connexion.html?inscrit=1';
    } catch (err) {
      erreur.textContent = 'Erreur de connexion au serveur';
    } finally {
      bouton.disabled = false;
      bouton.textContent = 'Créer mon compte';
    }
  });
</script>
</body>
</html>

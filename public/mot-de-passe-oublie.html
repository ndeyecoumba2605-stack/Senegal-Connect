<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — Sénégal Connect</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<header class="entete-simple">
  <a href="index.html" class="logo-hero">Sénégal <span>Connect</span></a>
  <nav><a href="inscription.html">Créer un compte</a></nav>
</header>

<section class="page-formulaire">
  <div class="motif-wax motif-wax--bas"></div>
  <div class="carte-formulaire">
    <h2>Mot de passe oublié</h2>
    <p class="sous-titre">Entrez votre email pour recevoir un lien de réinitialisation</p>

    <form id="formulaire-oubli">
      <div class="champ">
        <label>✉️ Email</label>
        <input name="email" type="email" placeholder="vous@exemple.sn" required>
      </div>
      <button type="submit" id="bouton-envoyer" class="bouton-form">Envoyer le lien</button>
      <p class="message-erreur" id="erreur"></p>
    </form>

    <div class="message-info cache" id="info">
      <p id="texte-info"></p>
      <a class="lien-demo" id="lien-demo" href="#"></a>
    </div>

    <div class="separateur-liens">
      <a href="connexion.html">← Retour à la connexion</a>
      <a href="inscription.html">Créer un compte</a>
    </div>
    <p class="connexion-securisee">🔒 Lien valable un temps limité</p>
  </div>
</section>

<script>
document.getElementById('formulaire-oubli').addEventListener('submit', async (e) => {
  e.preventDefault();
  const bouton = document.getElementById('bouton-envoyer');
  const erreurEl = document.getElementById('erreur');
  const infoEl = document.getElementById('info');
  erreurEl.textContent = '';
  bouton.disabled = true;
  bouton.textContent = 'Envoi...';

  const donnees = Object.fromEntries(new FormData(e.target));

  try {
    const reponse = await fetch('/api/auth/mot-de-passe-oublie', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(donnees),
    });
    const corps = await reponse.json();

    if (reponse.ok) {
      document.getElementById('texte-info').textContent = corps.message;
      infoEl.classList.remove('cache');

      if (corps.token_demo) {
        const lien = `reinitialiser-mot-de-passe.html?token=${corps.token_demo}`;
        const lienEl = document.getElementById('lien-demo');
        lienEl.href = lien;
        lienEl.textContent = `Lien de démo (${corps.expire_dans_minutes} min) : cliquer ici`;
      }
    } else {
      erreurEl.textContent = corps.message || corps.erreurs?.[0]?.message || 'Erreur';
    }
  } catch (err) {
    erreurEl.textContent = 'Impossible de contacter le serveur';
  } finally {
    bouton.disabled = false;
    bouton.textContent = 'Envoyer le lien';
  }
});
</script>
</body>
</html>

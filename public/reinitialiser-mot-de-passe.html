<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser le mot de passe — Sénégal Connect</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<header class="entete-simple">
  <a href="index.html" class="logo-hero">Sénégal <span>Connect</span></a>
  <nav><a href="connexion.html">Se connecter</a></nav>
</header>

<section class="page-formulaire">
  <div class="motif-wax motif-wax--bas"></div>
  <div class="carte-formulaire">
    <h2>Nouveau mot de passe</h2>
    <p class="sous-titre">Choisissez un nouveau mot de passe pour votre compte</p>

    <form id="formulaire-reinit">
      <div class="champ">
        <label>🔒 Nouveau mot de passe</label>
        <input id="champ-mdp" type="password" placeholder="Au moins 6 caractères" required minlength="6">
      </div>
      <div class="champ">
        <label>🔒 Confirmer le mot de passe</label>
        <input id="champ-mdp-confirmation" type="password" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" id="bouton-reinit" class="bouton-form">Réinitialiser</button>
      <p class="message-erreur" id="erreur"></p>
    </form>

    <div class="message-info cache" id="info">
      <p>✅ Mot de passe mis à jour. Redirection vers la connexion...</p>
    </div>
  </div>
</section>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const erreurEl = document.getElementById('erreur');

  if (!token) {
    erreurEl.textContent = 'Lien invalide ou incomplet — demandez un nouveau lien.';
    document.getElementById('formulaire-reinit').querySelector('button').disabled = true;
  }

  document.getElementById('formulaire-reinit').addEventListener('submit', async (e) => {
    e.preventDefault();
    erreurEl.textContent = '';

    const motDePasse = document.getElementById('champ-mdp').value;
    const confirmation = document.getElementById('champ-mdp-confirmation').value;
    if (motDePasse !== confirmation) {
      erreurEl.textContent = 'Les mots de passe ne correspondent pas';
      return;
    }

    const bouton = document.getElementById('bouton-reinit');
    bouton.disabled = true;
    bouton.textContent = 'Réinitialisation...';

    try {
      const reponse = await fetch('/api/auth/reinitialiser-mot-de-passe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, mot_de_passe: motDePasse }),
      });
      const corps = await reponse.json();

      if (reponse.ok) {
        document.getElementById('formulaire-reinit').classList.add('cache');
        document.getElementById('info').classList.remove('cache');
        setTimeout(() => { window.location.href = 'connexion.html'; }, 2000);
      } else {
        erreurEl.textContent = corps.message || 'Lien expiré ou invalide';
        bouton.disabled = false;
        bouton.textContent = 'Réinitialiser';
      }
    } catch (err) {
      erreurEl.textContent = 'Impossible de contacter le serveur';
      bouton.disabled = false;
      bouton.textContent = 'Réinitialiser';
    }
  });
</script>
</body>
</html>
